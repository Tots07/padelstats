try{
 const app=initializeApp(firebaseConfig),auth=getAuth(app);
 let db;try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=getFirestore(app)}

 window.FBS={

  set:(path,data)=>setDoc(doc(db,...P(path)),data),

 };

<script>
const FB=[['backhand','Revers'],['forehand','Coup droit']];
const SCHEMA=[
{k:'services',l:'Service',t:'n',i:[['first_serves_in','1er serv.'],['points_won_on_first_serve','Pts gagnés sur 1er'],['second_serves_in','2ème serv.'],['points_won_on_second_serve','Pts gagnés sur 2ème'],['aces','Aces'],['double_faults','Doubles fautes'],['breaks','Break']]},
{k:'shots_played',l:'Coups joués',t:'f',i:[['baseline','Fond de court'],['volley','Volée'],['overhead','Smash'],['bajada','Bajada'],['return','Retour']]},
{k:'errors',l:'Fautes',t:'f',i:[['baseline_forced','Fond – forcée'],['baseline_unforced','Fond – non forcée'],['volley_forced','Volée – forcée'],['volley_unforced','Volée – non forcée'],['overhead','Smash'],['bajada','Bajada'],['return','Retour']]},
{k:'winners',l:'Coups gagnants',t:'f',i:[['por_4','Por 4'],['remate','Remate'],['por_3','Por 3'],['bajada','Bajada'],['volley','Volée'],['other_winner','Autre'],['shots_forcing_error','Provoque une faute']]},
{k:'gifts',l:'Cadeaux',t:'f',i:[['gifts','Cadeaux']]}
];
const LBL={};
const path=(s,i)=>s.k==='gifts'?'gifts':s.k+'.'+i;
const zero=()=>{const o={};SCHEMA.forEach(s=>{if(s.k==='gifts'){o.gifts={forehand:0,backhand:0};FB.forEach(([f,fl])=>LBL['gifts.'+f]='Cadeaux ('+fl+')');return}o[s.k]={};s.i.forEach(([i,l,x])=>{const f2=s.t==='f'||x==='f';o[s.k][i]=f2?{forehand:0,backhand:0}:0;
 if(f2)FB.forEach(([f,fl])=>LBL[s.k+'.'+i+'.'+f]=s.l+' · '+l+' ('+fl+')');else LBL[path(s,i)]=s.l+' · '+l})});return o};
const mk=(id,pid,name,team,position)=>({id,pid,name,team,position,...zero()});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let DB={players:[],matches:[],invites:{}},S,M,si=0,tab='count',view='boot',cur=null,ask=null,mn=false,CS=null,hp=0,hs=20;
const PS={p1:'right',p2:'left',p3:'left',p4:'right'};zero();DB.matches.forEach(m=>{if(!m.sets){m.roster=m.players.map(({id,pid,name,team,position})=>({id,pid,name,team,position}));m.sets=[{id:uid(),n:1,history:m.history||[],players:m.players}];delete m.players;delete m.history}
 m.roster.forEach(r=>r.position=PS[r.id]);m.sets.forEach(s=>{s.first=s.first||{A:null,B:null};if(s.t0===undefined)s.t0=null;s.mode=s.mode||{games:6,rule:'star'};s.score=s.score||{g:[0,0],p:[0,0],tb:false,done:null,gl:[]};s.players.forEach(p=>{p.position=PS[p.id];const w=p.winners;let c=0;for(const k in w)if(typeof w[k]==='number'){w[k]={forehand:w[k],backhand:0};c=1}if(typeof p.services.breaks!=='number')p.services.breaks=0;if(c)s.history=[]})})});
let ROLE=null,MEP=null,synced={},tmr=null,cst='local',loginMsg='',pickSel='';
const RO=()=>ROLE!=='admin';
const trimO=m=>{const o=JSON.parse(JSON.stringify(m,(k,v)=>k==='history'&&Array.isArray(v)?v.slice(-60):v));o.playerIds=m.roster.map(r=>r.pid);return o};
const save=()=>{if(ROLE==='admin'){clearTimeout(tmr);tmr=setTimeout(push,600)}};
const setSt=s=>{cst=s;if(view==='home')render()};
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)};
function saveBlob(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function push(){if(ROLE!=='admin')return;
 const want={};DB.players.forEach(p=>want['players/'+p.id]=JSON.stringify(p));DB.matches.forEach(m=>want['matches/'+m.id]=JSON.stringify(trimO(m)));
 const jobs=[];
 for(const k in want)if(synced[k]!==want[k]){const v=want[k];synced[k]=v;jobs.push(FBS.set(k,JSON.parse(v)).catch(e=>{if(synced[k]===v)delete synced[k];throw e}))}
 for(const k in synced)if(!(k in want)){delete synced[k];jobs.push(FBS.del(k))}
 if(!jobs.length)return;setSt('sync');Promise.all(jobs).then(()=>setSt('ok')).catch(e=>{console.error(e);setSt('err')})}
async function loadAdmin(){const [pl,ma,iv]=await Promise.all([FBS.list('players'),FBS.list('matches'),FBS.list('invites')]);
 DB.players=pl.sort((a,b)=>a.name.localeCompare(b.name,'fr'));DB.matches=ma.map(m=>{delete m.playerIds;return m});DB.invites={};iv.forEach(i=>DB.invites[i.id]=i.code);
 synced={};DB.players.forEach(p=>synced['players/'+p.id]=JSON.stringify(p));DB.matches.forEach(m=>synced['matches/'+m.id]=JSON.stringify(trimO(m)));cst='ok'}
async function loadGuest(){DB.players=await FBS.list('players');DB.matches=await FBS.list('matches',['playerIds','array-contains',MEP]);cst='ok'}
async function boot(){
 view='boot';render();await window.fbReady;
 if(!window.FBS){loginMsg='Firebase indisponible : vérifie la connexion internet.';view='login';render();return}
 FBS.onAuth(async u=>{try{
  if(!u){ROLE=null;MEP=null;DB={players:[],matches:[],invites:{}};M=S=null;view='login';render();return}
  if(!u.isAnonymous){
   let ok=true;try{await FBS.get('invites/__ping')}catch(e){ok=false}
   if(!ok){loginMsg='Ce compte Google n’est pas autorisé comme admin.';await FBS.out();return}
   ROLE='admin';await loadAdmin();loginMsg='';view='home';render();return}
  const c=await FBS.get('claims/'+u.uid).catch(()=>null);
  if(c&&c.playerId){ROLE='guest';MEP=c.playerId;await loadGuest();loginMsg='';view='home';render()}
  else{ROLE=null;DB.players=await FBS.list('players').catch(()=>[]);view='pick';render()}
 }catch(e){console.error(e);loginMsg='Erreur de connexion : '+(e.code||e.message);view='login';render()}})}
async function claim(){const pid=document.getElementById('pp').value,code=document.getElementById('pc').value.trim().toUpperCase(),u=FBS.user();pickSel=pid;
 if(!pid||!code){loginMsg='Choisis ton profil et saisis le code.';render();return}
 try{await FBS.set('claims/'+u.uid,{playerId:pid,code});ROLE='guest';MEP=pid;await loadGuest();loginMsg='';view='home';render()}
 catch(e){loginMsg=e.code==='permission-denied'?'Code incorrect pour ce profil.':'Erreur : '+(e.code||e.message);render()}}
async function reloadData(){try{if(ROLE==='admin'){if(cst==='sync'){toast('Synchronisation en cours…');return}await loadAdmin()}else await loadGuest();M=S=null;render();toast('Données actualisées')}catch(e){toast('Actualisation impossible')}}
const genCode=()=>{const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<6;i++)c+=A[Math.floor(Math.random()*A.length)];return c};
async function newCode(){const code=genCode();try{await FBS.set('invites/'+cur,{code});DB.invites[cur]=code;render()}catch(e){toast('Impossible de créer le code')}}
async function revoke(){try{const cl=await FBS.list('claims',['playerId','==',cur]);await Promise.all(cl.map(c=>FBS.del('claims/'+c.id)));toast(cl.length?cl.length+' connexion(s) révoquée(s)':'Aucune connexion à révoquer')}catch(e){toast('Révocation impossible')}}
const renderBoot=()=>'<p class="mut">Connexion…</p>';
const renderLogin=()=>`<div class="lg"><p class="mut">Connecte-toi pour accéder aux analyses.</p>${loginMsg?`<p class="err">${esc(loginMsg)}</p>`:''}<div class="lgb"><button class="big" data-act="glogin">Connexion admin (Google)</button><button class="big alt" data-act="alogin">Je suis un joueur</button></div></div>`;
const renderPick=()=>`<div class="lg"><h2>Qui es-tu ?</h2><p class="mut">Choisis ton profil et saisis le code d’accès donné par l’admin.</p>${loginMsg?`<p class="err">${esc(loginMsg)}</p>`:''}<div class="pk"><select id="pp"><option value="">Choisir mon profil…</option>${DB.players.map(p=>`<option value="${esc(p.id)}"${p.id===pickSel?' selected':''}>${esc(p.name)}</option>`).join('')}</select><input id="pc" placeholder="Code d’accès" autocomplete="off" autocapitalize="characters" maxlength="12"></div><div class="lgb"><button class="big" data-act="claim">Se connecter</button><button class="big alt" data-act="logout">Retour</button></div></div>`;
function exportMatch(id){const m=DB.matches.find(x=>x.id===id);if(!m)return;saveBlob(`padel-analyse-${m.date}.json`,new Blob([JSON.stringify({format:'padel-analysis',v:1,match:m},null,1)],{type:'application/json'}))}
async function importMatch(f){if(!f)return;try{
 const m=JSON.parse(await f.text()).match;
 if(!m||!Array.isArray(m.roster)||m.roster.length!==4||!Array.isArray(m.sets)||!m.sets.length||!m.sets.every(s=>s.score&&s.mode&&Array.isArray(s.players)))throw 0;
 m.id=uid();m.roster.forEach(r=>{let p=DB.players.find(x=>x.name.toLowerCase()===String(r.name).toLowerCase());if(!p){p={id:uid(),name:String(r.name)};DB.players.push(p)}r.pid=p.id});
 DB.players.sort((a,b)=>a.name.localeCompare(b.name,'fr'));
 m.sets.forEach(s=>{s.id=uid();s.history=s.history||[];s.first=s.first||{A:null,B:null};if(s.t0===undefined)s.t0=null;s.players.forEach(p=>{const r=m.roster.find(x=>x.id===p.id);if(r)p.pid=r.pid})});
 DB.matches.push(m);save();render();toast('Analyse importée')}catch(e){toast('Fichier invalide : import impossible')}}
document.addEventListener('change',e=>{if(e.target.id==='imp'){[...e.target.files].forEach(f=>importMatch(f));e.target.value=''}if(e.target.id==='ps'){hs=+e.target.value;hp=0;render()}});
const ref=(p,pa)=>{const k=pa.split('.');const last=k.pop();return [k.reduce((o,x)=>o[x],p),last]};
const get=(p,pa)=>{const [o,k]=ref(p,pa);return o[k]};
const bump=(pid,pa,d)=>{const p=S.players.find(x=>x.id===pid);const [o,k]=ref(p,pa);if(o[k]+d<0)return false;o[k]+=d;return true};
const ctr=(pid,pa,v)=>`<div class="ctr"><button data-p="${pid}" data-a="${pa}" data-d="-1" aria-label="Retirer">−</button><b>${v}</b><button class="p" data-p="${pid}" data-a="${pa}" data-d="1" aria-label="Ajouter">+</button></div>`;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const total=(p,s)=>s.i.reduce((n,[i])=>{const v=s.k==='gifts'?p.gifts:p[s.k][i];return n+(typeof v==='object'?v.forehand+v.backhand:v)},0);
const mini=(pid,pa,v)=>`<span class="c"><input class="v" type="number" min="0" inputmode="numeric" value="${v}" data-p="${pid}" data-a="${pa}" aria-label="Valeur"><button class="p" data-p="${pid}" data-a="${pa}" data-d="1" aria-label="Ajouter">+</button></span>`;
const rows=(p,s,hd)=>((s.t==='f'||s.i[0][2]==='f')&&hd?`<div class="r f hd"><span></span><i>CD</i><i>Rev</i></div>`:'')+s.i.filter(x=>x[0]!=='breaks').map(([i,l0,x],_,__,l=SH2[s.k+'.'+i]||l0)=>s.t==='f'||x==='f'?`<div class="r f${s.k==='gifts'?' gf':''}${i==='shots_forcing_error'?' sp':''}"><span>${l}</span>${FB.map(([f])=>{const pa=s.k==='gifts'?'gifts.'+f:s.k+'.'+i+'.'+f;return mini(p.id,pa,get(p,pa))}).join('')}</div>`:`<div class="r${S.pend&&S.pend.pid===p.id&&S.pend.k===i?' pd':''}"><span>${l}</span>${mini(p.id,path(s,i),get(p,path(s,i)))}</div>`).join('');
const CAT={services:'sv',shots_played:'sp',errors:'er',winners:'wn'};
const TW={services:1,shots_played:1,winners:1,errors:1};
const SH2={'services.first_serves_in':'1<sup>er</sup> serv.','services.second_serves_in':'2<sup>ème</sup> serv.','services.points_won_on_first_serve':'Pts gagnés sur 1<sup>er</sup>','services.points_won_on_second_serve':'Pts gagnés sur 2<sup>ème</sup>','shots_played.baseline':'Fond','errors.baseline_forced':'Fond F','errors.baseline_unforced':'Fond NF','errors.volley_forced':'Volée F','errors.volley_unforced':'Volée NF'};
const enc=(p,t,ks,x='')=>{const k=ks[0],tw=TW[k],hd=SCHEMA.find(s=>s.k===k).t==='f'?(tw?`<h3 class="h2"><div class="hh"><span>${t}</span><i>Rev</i><i>CD</i></div><div class="hh"><span></span><i>Rev</i><i>CD</i></div></h3>`:`<h3 class="hf"><span>${t}</span><i>Rev</i><i>CD</i></h3>`):`<h3 class="sh">${t}</h3>`,bd=ks.map(q=>rows(p,SCHEMA.find(s=>s.k===q),0)).join('');return `<div class="e ${CAT[k]} ${x}">${hd}${tw?`<div class="bd2">${bd}</div>`:bd}</div>`};
const ENC={S:p=>enc(p,'Service<span class="np"><b>'+esc(p.name)+'</b> · Éq. '+p.team+' · '+(p.position==='left'?'gauche':'droite')+'</span>',['services'],CS?CS.id===p.id?'on':'off':''),W:p=>enc(p,'Gagnants',['winners']),F:p=>enc(p,'Fautes',['errors','gifts']),J:p=>enc(p,'Joués',['shots_played'])};
const CELL=[[['WS','FJ'],50,0],[['SW','JF'],50,0],[['FJ','WS'],50,0],[['JF','SW'],50,0]];
const order=()=>{const P=S.players;return S.flip?[P[2],P[1],P[3],P[0]]:[P[1],P[2],P[0],P[3]]};
const quad=(p,i,_,[lo,w,m]=CELL[i])=>`<section class="q ${p.team}${m?' m':''}"><div class="cols" style="grid-template-columns:${w}fr ${100-w}fr">${lo.map(c=>`<div class="k">${[...c].map(l=>ENC[l](p)).join('')}</div>`).join('')}</div></section>`;
function renderCount(){CS=srv();return `<div class="quads">${order().map(quad).join('')}<button id="undo" class="ub" aria-label="Annuler le dernier clic">↶</button></div>`}
function renderStats(){
 const P=S.players;
 const cell=(vals,main,sub)=>{const m=Math.max(...vals.map(main));return vals.map(v=>`<td class="${main(v)===m&&m>0?'top':''}"><b>${main(v)}</b>${sub?`<small>${sub(v)}</small>`:''}</td>`).join('')};
 let h=`<div class="wrap"><table><thead><tr><th></th>${P.map(p=>`<th class="${p.team}">${esc(p.name)}</th>`).join('')}</tr></thead><tbody>`;
 SCHEMA.forEach(s=>{h+=`<tr class="sec"><th colspan="5">${s.l}</th></tr>`;
  s.i.forEach(([i,l,x])=>{h+=`<tr><td>${l}</td>`;
   if(s.t==='f'||x==='f')h+=cell(P.map(p=>s.k==='gifts'?p.gifts:p[s.k][i]),v=>v.forehand+v.backhand,v=>`Rev ${v.backhand} · CD ${v.forehand}`);
   else h+=cell(P,p=>get(p,path(s,i)));
   h+='</tr>'})});
 const W=SCHEMA[3],E=SCHEMA[2],Sv=SCHEMA[0];
 const pct=(a,b)=>b?Math.round(100*a/b):0;
 h+=`<tr class="sec"><th colspan="5">Bilan</th></tr>`;
 h+=`<tr><td>Total coups gagnants</td>${cell(P,p=>total(p,W))}</tr>`;

const mtitle=m=>m.roster.slice(0,2).map(p=>p.name).join(' / ')+' vs '+m.roster.slice(2).map(p=>p.name).join(' / ');
const askb=(c,id)=>`<button class="x${ask===id?' ask':''}" data-${c}="${id}" aria-label="Supprimer">${ask===id?'Supprimer ?':'🗑'}</button>`;
const IPL='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
const renderHome=mt=>{const pc=Math.max(1,Math.ceil(mt.length/hs));hp=Math.min(hp,pc-1);const pgm=mt.slice(hp*hs,hp*hs+hs);
 const row=m=>`<li><button class="it" data-open="${m.id}"><div class="l1"><b>${fmt(m.date)}</b><span>&nbsp;: ${m.sets.map(s=>s.score.g.join('-')).join(' \u00b7 ')}</span></div><span>${esc(mtitle(m))}</span></button>${RO()?'':`<button class="x" data-exp="${m.id}" title="Exporter l\u2019analyse (fichier JSON)" aria-label="Exporter l\u2019analyse">${IPL}<path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button>${askb('del',m.id)}`}</li>`;
 return `<div class="hh1"><h2>${RO()?'Mes analyses':'Analyse de match'}${cst==='err'?'<span title="Sauvegarde dans le compte impossible : enregistrement Firebase refusé ou impossible"> \u26a0</span>':''}</h2><div class="ia2">${RO()?'':`<button class="big ico" data-act="new" title="Nouvelle analyse" aria-label="Nouvelle analyse">${IPL}<path d="M12 5v14M5 12h14"/></svg></button><button class="big alt ico" data-act="imp" title="Importer une analyse" aria-label="Importer une analyse">${IPL}<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg></button><input type="file" id="imp" accept=".json,application/json" multiple hidden><button class="big alt ico" data-go="players" title="Profil : liste des joueurs" aria-label="Liste des joueurs">${IPL}<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></button>`}<button class="big alt ico" data-act="reload" title="Actualiser" aria-label="Actualiser">${IPL}<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button><button class="big alt ico" data-act="logout" title="Se déconnecter" aria-label="Se déconnecter">${IPL}<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button></div></div>`+(mt.length?`<ul class="lst lst2">${pgm.map(row).join('')}</ul><div class="pgr"><button data-pg="-1"${hp<1?' disabled':''} aria-label="Page pr\u00e9c\u00e9dente">\u2039</button><span>Page ${hp+1} / ${pc}</span><button data-pg="1"${hp>=pc-1?' disabled':''} aria-label="Page suivante">\u203a</button><label>Par page <select id="ps">${[10,20,50,100].map(n=>`<option${n===hs?' selected':''}>${n}</option>`).join('')}</select></label></div>`:`<p class="mut">${RO()?'Aucune analyse ne te concerne pour l\u2019instant.':'Aucune analyse pour l\u2019instant. Cr\u00e9e la premi\u00e8re avec le bouton +.'}</p>`)};
const nm=id=>DB.matches.filter(m=>m.roster.some(p=>p.pid===id)).length;
const renderPlayers=()=>`<div class="add"><input id="np" placeholder="Nom du joueur" maxlength="30" aria-label="Nom du nouveau joueur"><button class="big" data-act="addp">Ajouter</button></div>`+(DB.players.length?`<ul class="lst">${DB.players.map(p=>`<li><button class="it" data-pl="${p.id}"><b>${esc(p.name)}</b><span>${nm(p.id)} analyse${nm(p.id)>1?'s':''}${(p.alias||[]).length?' · 🎤 '+esc(p.alias.join(', ')):''}</span></button>${nm(p.id)?'':askb('delp',p.id)}</li>`).join('')}</ul>`:`<p class="mut">Ajoute tes joueurs ici : ils seront proposés quand tu crées une analyse.</p>`);
const nameBox=()=>{const pl=DB.players.find(p=>p.id===cur);return `<h2>Nom du joueur</h2><div class="add"><input id="nn" value="${esc(pl.name)}" maxlength="30" aria-label="Nom du joueur"><button class="big" data-act="ren">Renommer</button></div>`};
function renamePlayer(){const pl=DB.players.find(p=>p.id===cur),v=(document.getElementById('nn').value||'').trim();if(!pl||!v||v===pl.name)return;
 if(DB.players.some(p=>p.id!==pl.id&&p.name.toLowerCase()===v.toLowerCase())){toast('Ce nom existe déjà dans ta liste');return}
 pl.name=v;DB.matches.forEach(m=>{m.roster.forEach(r=>{if(r.pid===pl.id)r.name=v});m.sets.forEach(st=>st.players.forEach(q=>{if(q.pid===pl.id)q.name=v}))});
 DB.players.sort((a,b)=>a.name.localeCompare(b.name,'fr'));save();render();toast('Nom modifié')}
const accessBox=()=>{const c=(DB.invites||{})[cur];return `<h2>Accès du joueur</h2><p class="mut">Pour qu’il consulte ses analyses : il ouvre l’appli, choisit « Je suis un joueur », sélectionne son profil et saisit ce code. Il ne voit que les analyses où il joue.</p><div class="add"><input id="ic" value="${c?esc(c):''}" placeholder="Aucun code" readonly aria-label="Code d’accès"><button class="big" data-act="gcode">${c?'Nouveau code':'Générer un code'}</button></div><p><button class="alt" data-act="revoke" style="padding:8px 14px;border-radius:10px;font:500 15px Barlow,sans-serif;cursor:pointer">Révoquer les connexions de ce joueur</button></p>`};
const aliasBox=()=>{const pl=DB.players.find(p=>p.id===cur),al=pl.alias||[];return `<h2>Reconnaissance vocale</h2><p class="mut">Mots reconnus pour « ${esc(pl.name)} » en plus de son nom : surnoms, ou orthographes que la reconnaissance comprend mal.</p><div class="al">${al.map((a,i)=>`<span class="chip">${esc(a)}<button data-dela="${i}" aria-label="Retirer l’alias ${esc(a)}">×</button></span>`).join('')||'<span class="mut">Aucun alias pour l’instant.</span>'}</div><div class="add"><input id="na" placeholder="Ajouter un alias (ex. Tom)" maxlength="30" aria-label="Nouvel alias"><button class="big" data-act="adda">Ajouter</button></div>`};
function addAlias(){const i=document.getElementById('na'),v=i.value.trim(),pl=DB.players.find(p=>p.id===cur);if(!vnorm(v)||!pl)return;pl.alias=pl.alias||[];if(!pl.alias.some(a=>vnorm(a)===vnorm(v))){pl.alias.push(v);save()}render();const n=document.getElementById('na');if(n)n.focus()}
const renderPlayer=mt=>{const ms=mt.filter(m=>m.roster.some(p=>p.pid===cur));return nameBox()+aliasBox()+accessBox()+`<h2>Historique des analyses</h2>`+(ms.length?`<ul class="lst">${ms.map(m=>{const me=m.roster.find(p=>p.pid===cur),mate=m.roster.find(p=>p.team===me.team&&p!==me),opp=m.roster.filter(p=>p.team!==me.team).map(p=>p.name).join(' / ');return `<li><button class="it" data-open="${m.id}"><b>${fmt(m.date)}</b><span>Avec ${esc(mate.name)} contre ${esc(opp)}</span><span>${m.sets.reduce((n,s)=>n+total(s.players.find(p=>p.pid===cur),SCHEMA[3]),0)} gagnants · ${m.sets.reduce((n,s)=>n+total(s.players.find(p=>p.pid===cur),SCHEMA[2]),0)} fautes · ${m.sets.length} set${m.sets.length>1?'s':''}</span></button></li>`}).join('')}</ul>`:`<p class="mut">Ce joueur n’a encore participé à aucune analyse.</p>`)};
function openNew(){const d=document.getElementById('dlg');
 if(DB.players.length<4)d.innerHTML=`<h2>Nouvelle analyse</h2><p>Il faut au moins 4 joueurs dans la liste (${DB.players.length} pour l’instant).</p><div class="dact"><button class="alt" data-close>Fermer</button><button class="big" data-go="players" data-close>Liste des joueurs</button></div>`;
 else d.innerHTML=`<h2>Nouvelle analyse</h2><label>Date du match<input type="date" id="nd" value="${new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)}"></label>${modeHtml()}<div class="sl">${[['Joueur 1','équipe A, droite'],['Joueur 2','équipe A, gauche'],['Joueur 3','équipe B, gauche'],['Joueur 4','équipe B, droite']].map(([a,b],i)=>`<label style="order:${[2,1,3,4][i]}">${a} <small>(${b})</small><select class="ns"><option value="">Choisir…</option>${DB.players.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label>`).join('')}</div><p class="err" id="err" role="alert"></p><div class="dact"><button class="alt" data-close>Annuler</button><button class="big" data-act="create">Créer et compter</button></div>`;
 d.showModal()}
function create(){const ids=[...document.querySelectorAll('.ns')].map(s=>s.value),date=document.getElementById('nd').value,err=document.getElementById('err');
 if(!date||ids.some(x=>!x)){err.textContent='Choisis la date et les 4 joueurs.';return}
 if(new Set(ids).size<4){err.textContent='Un joueur ne peut occuper qu’une seule place.';return}
 const POS=[['A','right'],['A','left'],['B','left'],['B','right']];
 const m={id:uid(),date,sets:[],roster:ids.map((pid,i)=>({id:'p'+(i+1),pid,name:DB.players.find(p=>p.id===pid).name,team:POS[i][0],position:POS[i][1]}))};
 m.sets.push(newSet(m,1,readMode()));DB.matches.push(m);save();document.getElementById('dlg').close();M=m;si=0;S=m.sets[0];view='match';tab='count';render()}
function addP(){const i=document.getElementById('np'),n=i.value.trim();if(!n||DB.players.some(p=>p.name.toLowerCase()===n.toLowerCase()))return;DB.players.push({id:uid(),name:n});DB.players.sort((a,b)=>a.name.localeCompare(b.name,'fr'));save();render();document.getElementById('np').focus()}
function render(){vsync();
 const hd=document.getElementById('hd'),app=document.getElementById('app');
 const bk=(to,l)=>`<button class="bk" data-go="${to}">← ${l}</button>`;
 const mt=[...DB.matches].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
 if(view==='match'&&S){if((M.closed||RO())&&tab==='count')tab='over';hd.innerHTML=`<div class="hr2"><div class="hl"><button class="bk" data-go="home" aria-label="Accueil">←</button><div class="ttl"><b>${fmtS(M.date)}</b></div><div class="tabs" role="tablist">${(M.closed||RO()?[]:[['count','Compter']]).concat([['over','Overview'],['stats','Statistiques']]).map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${l}</button>`).join('')}</div></div><div class="chips">${M.sets.map((s,i)=>`<button data-set="${i}" aria-pressed="${i===si}">Set ${s.n} · ${s.score.g.join('-')}</button>`).join('')}</div><div class="ia">${RO()?'':M.closed?'<button class="rop" data-act="reopen">Rouvrir le match</button>':`<button data-act="newset" title="Nouveau set" aria-label="Nouveau set">+</button><button class="rs${ask==='reset'?' ask':''}" data-act="reset" title="Reset du set" aria-label="Reset du set">${ask==='reset'?'Confirmer ?':'↺'}</button><button class="rs${ask==='delset'?' ask':''}" data-act="delset" title="Supprimer le set" aria-label="Supprimer le set">${ask==='delset'?'Confirmer ?':'🗑'}</button>`}${M.closed||RO()?'':`<button data-act="mic" title="Commande vocale" aria-label="Commande vocale" aria-pressed="${vOpen}">🎤</button>`}<button data-act="export" title="Exporter en PDF" aria-label="Exporter en PDF"><span class="pi">📄<b>PDF</b></span></button><button data-act="flip" title="Inverser les côtés" aria-label="Inverser les côtés" aria-pressed="${!!S.flip}">⇅</button></div></div>${banner(tab==='count')}`;app.innerHTML=tab==='count'?renderCount():tab==='over'?renderOver():renderStats()}
 else if(view==='boot'){hd.innerHTML='<h1>Padel Stats</h1>';app.innerHTML=renderBoot()}
 else if(view==='login'){hd.innerHTML='<h1>Padel Stats</h1>';app.innerHTML=renderLogin()}
 else if(view==='pick'){hd.innerHTML='<h1>Padel Stats</h1>';app.innerHTML=renderPick()}
 else if(view==='players'){hd.innerHTML=bk('home','Accueil')+'<h1>Liste des joueurs</h1>';app.innerHTML=renderPlayers()}
 else if(view==='player'&&DB.players.some(p=>p.id===cur)){hd.innerHTML=bk('players','Liste des joueurs')+`<h1>${esc(DB.players.find(p=>p.id===cur).name)}</h1>`;app.innerHTML=renderPlayer(mt)}
 else{view='home';hd.innerHTML='<h1>Padel Stats</h1>';app.innerHTML=renderHome(mt)}
 const l=view==='match'&&S?S.history[S.history.length-1]:null,u=document.getElementById('undo');
 if(u){u.disabled=!l;u.title=l?'Annuler : '+(l.snap?l.lbl:`${S.players.find(p=>p.id===l.pid).name} · ${LBL[l.a]} ${l.d>0?'+':'−'}${Math.abs(l.d)}`):'Rien à annuler'}}
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t){if(mn){mn=false;render()}return}const prev=ask,pm=mn;ask=null;mn=false;
 if(t.dataset.tab){tab=t.dataset.tab;render();return}
 if(t.dataset.a){hit(t.dataset.p,t.dataset.a);return}
 if(t.id==='undo'){const l=S.history.pop();if(l){if(l.pid)bump(l.pid,l.a,-l.d);if(l.a2)bump(l.pid,l.a2,-l.d);if(l.brk)bump(l.brk,'services.breaks',-1);if(l.ace)bump(l.ace,'services.aces',-1);if(l.pw)bump(l.pw[0],l.pw[1],-1);if(l.pp!==undefined)S.pend=JSON.parse(l.pp);if(l.snap)S.score=JSON.parse(l.snap);save();render()}return}
 if(t.dataset.set){si=+t.dataset.set;S=M.sets[si];render();return}
 if(t.dataset.sv){setServer(t.dataset.sv);S.ch=false;save();render();return}
 if(t.dataset.svc){S.ch=true;render();return}
 if(t.dataset.go){if(t.hasAttribute('data-close'))document.getElementById('dlg').close();view=t.dataset.go;cur=null;render();return}
 if(t.hasAttribute('data-close')){document.getElementById('dlg').close();return}
 if(t.dataset.open){M=DB.matches.find(m=>m.id===t.dataset.open);si=M.sets.length-1;S=M.sets[si];view='match';tab='over';window.scrollTo(0,0);render();return}
 if(t.dataset.pg){hp+=+t.dataset.pg;render();return}
 if(t.dataset.dela!==undefined){const pl=DB.players.find(x=>x.id===cur);if(pl&&pl.alias){pl.alias.splice(+t.dataset.dela,1);save();render()}return}
 if(t.dataset.exp){exportMatch(t.dataset.exp);return}
 if(t.dataset.pl){view='player';cur=t.dataset.pl;render();return}
 if(t.dataset.del){if(prev===t.dataset.del)DB.matches=DB.matches.filter(m=>m.id!==t.dataset.del);else ask=t.dataset.del;save();render();return}
 if(t.dataset.delp){if(prev===t.dataset.delp)DB.players=DB.players.filter(p=>p.id!==t.dataset.delp);else ask=t.dataset.delp;save();render();return}
 if(t.dataset.act==='new')openNew();
 else if(t.dataset.act==='addp')addP();
 else if(t.dataset.act==='imp')document.getElementById('imp').click();
 else if(t.dataset.act==='create')create();
 else if(t.dataset.act==='menu'){mn=!pm;render()}
 else if(t.dataset.act==='newset'){render();openSet()}
 else if(t.dataset.act==='reset'){if(prev==='reset'){const n=newSet(M,S.n,S.mode);S.players=n.players;S.score=n.score;S.first=n.first;S.t0=n.t0;S.ch=false;S.pend=null;S.history=[];save()}else ask='reset';render()}
 else if(t.dataset.act==='close-match'){document.getElementById('dlg').close();M.closed=true;tab='over';save();render()}
 else if(t.dataset.act==='reopen'){M.closed=false;tab='count';save();render()}
 else if(t.dataset.act==='endset')endSetDlg();
 else if(t.dataset.act==='mic')voiceToggle();
 else if(t.dataset.act==='glogin'){loginMsg='';FBS.google().catch(e=>{loginMsg='Connexion Google impossible : '+(e.code||e.message);render()})}
 else if(t.dataset.act==='alogin'){loginMsg='';FBS.anon().catch(e=>{loginMsg='Connexion impossible : '+(e.code||e.message);render()})}
 else if(t.dataset.act==='claim')claim();
 else if(t.dataset.act==='logout'){loginMsg='';FBS.out()}
 else if(t.dataset.act==='reload')reloadData();
 else if(t.dataset.act==='gcode')newCode();
 else if(t.dataset.act==='revoke')revoke();
 else if(t.dataset.act==='adda')addAlias();
 else if(t.dataset.act==='ren')renamePlayer();
 else if(t.dataset.act==='delset'){if(M.sets.length<2)toast('Impossible : une analyse doit garder au moins un set');else{if(prev==='delset'){M.sets.splice(si,1);M.sets.forEach((s,i)=>s.n=i+1);si=Math.min(si,M.sets.length-1);S=M.sets[si];save()}else ask='delset';render()}}
 else if(t.dataset.act==='mkset')mkset();
 else if(t.dataset.act==='export')exportPdf();
 else if(t.dataset.act==='flip'){S.flip=!S.flip;save();render()}
});
document.addEventListener('change',e=>{const t=e.target,id=t.dataset.name;if(id){S.players.find(p=>p.id===id).name=t.value.trim()||'Joueur';save();render()}else if(t.dataset.a){const p=S.players.find(x=>x.id===t.dataset.p),n=Math.max(0,Math.floor(+t.value||0)),d=n-get(p,t.dataset.a);if(d&&bump(p.id,t.dataset.a,d))S.history.push({pid:p.id,a:t.dataset.a,d});save();render()}});
document.addEventListener('focusin',e=>{if(e.target.classList.contains('v'))e.target.select()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('v'))e.target.blur();if(e.key==='Enter'&&e.target.id==='np')addP();if(e.key==='Enter'&&e.target.id==='na')addAlias();if(e.key==='Enter'&&e.target.id==='nn')renamePlayer()});
render();
boot();
</script>
</body>
</html>
